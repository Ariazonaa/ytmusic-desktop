[package]
name = "ytmusic-desktop"
version = "0.8.0"
edition = "2021"
license = "MIT"

[lib]
name = "ytmusic_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
# The plugin list. The same HTTP client and TLS setup as tauri-plugin-updater,
# so nothing new is built.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
# Must match the versions Tauri itself uses, see Cargo.lock.
tauri-winrt-notification = "0.8"
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

