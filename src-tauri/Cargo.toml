[package]
name = "ytmusic-desktop"
version = "0.10.0-beta.1"
edition = "2021"
license = "MIT"

[lib]
name = "ytmusic_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# Without "zip": updates are the installer and the AppImage themselves, not
# archives, so nothing is unpacked.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sys-locale = "0.3"
base64 = "0.22"
zip = { version = "9", default-features = false, features = ["deflate"] }
# The plugin list. The same HTTP client and TLS setup as tauri-plugin-updater,
# so nothing new is built.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"
tempfile = "3"

[target.'cfg(not(windows))'.dependencies]
# Notifications where Windows' own toasts are not, see `notification.rs`. The
# library tauri-plugin-notification uses, without its script in every page.
notify-rust = "4"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# Security keys for the Google sign-in, which WebKitGTK cannot ask itself. The
# same library Firefox uses, with its cryptography in Rust, so no crypto library
# of the system; it finds the keys through libudev.
authenticator = { version = "0.5", default-features = false, features = ["crypto_rust"] }
# Must match the version wry uses, see Cargo.lock.
webkit2gtk = "2.0"

[target.'cfg(windows)'.dependencies]
# Must match the versions Tauri itself uses, see Cargo.lock.
webview2-com = "0.39"
windows-core = "0.62"
# The same version the autostart plugin uses, for its entry with quotes.
windows-registry = "0.6"
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Graphics_Gdi",
    "Win32_Storage_EnhancedStorage",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

