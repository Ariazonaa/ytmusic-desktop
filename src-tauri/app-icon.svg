<!-- Source of the app icon. Regenerate the files in icons/ with: npx tauri icon src-tauri/app-icon.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26262e" />
      <stop offset="1" stop-color="#0c0c0f" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2d55" />
      <stop offset="1" stop-color="#ff8a3d" />
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#background)" />
  <!-- Equalizer bars: the audio the app plays and shapes. -->
  <g fill="url(#accent)">
    <rect x="216" y="402" width="88" height="220" rx="44" />
    <rect x="348" y="312" width="88" height="400" rx="44" />
    <rect x="480" y="362" width="88" height="300" rx="44" />
  </g>
  <!-- Play triangle with rounded corners. -->
  <path d="M664 364 L808 512 L664 660 Z" fill="#fff" stroke="#fff" stroke-width="56" stroke-linejoin="round" />
</svg>
