name: Release

# A tag like v1.2.3 builds the app for Windows and Linux, signs what the
# updater installs and publishes a release with it. Running apps learn of the
# new version from the release's latest.json. Afterwards the package for Arch
# Linux is built from the release's .deb and attached with its .SRCINFO.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  existing:
    name: Look for an existing release
    # A release can also be made by hand, see docs/development.md. Its tag
    # starts this workflow too, and then there is nothing left to do.
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.look.outputs.found }}
    steps:
      - id: look
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "::notice::A release for $TAG exists already. Nothing to do."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}

  windows:
    name: Build for Windows
    needs: existing
    if: needs.existing.outputs.found != 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set up Rust
        run: |
          $bin = "$env:USERPROFILE/.cargo/bin"
          if (-not (Test-Path "$bin/rustup.exe")) {
            Invoke-WebRequest https://win.rustup.rs/x86_64 -OutFile "$env:TEMP/rustup-init.exe"
            & "$env:TEMP/rustup-init.exe" -y --default-toolchain none --no-modify-path
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$bin/rustup.exe" toolchain install stable --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm ci
      - run: npm test
      # The key the updater's signatures are made with. The app only installs
      # what is signed with it, see "pubkey" in src-tauri/tauri.conf.json.
      - run: npm run tauri build -- --config src-tauri/tauri.release.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - run: node scripts/release.mjs collect
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-parts/windows/

  linux:
    name: Build for Linux
    needs: existing
    if: needs.existing.outputs.found != 'true'
    # The oldest Ubuntu with WebKitGTK 4.1: the AppImage then runs on older systems too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends build-essential curl file pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run tauri build -- --config src-tauri/tauri.release.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - run: node scripts/release.mjs collect
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release-parts/linux/

  publish:
    name: Publish
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: release-parts/windows
      - uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: release-parts/linux
      - run: node scripts/release.mjs "$GITHUB_REF_NAME"
      # A tag like v1.2.0-beta.1 becomes a pre-release, which installed apps
      # never update to, see scripts/release.mjs.
      - name: Publish
        run: |
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$GITHUB_REF_NAME" release/*.exe release/*.zip release/*.deb release/*.AppImage \
            release/SHA256SUMS.txt release/latest.json --title "$GITHUB_REF_NAME" --notes-file release/notes.md $pre
        env:
          GH_TOKEN: ${{ github.token }}
      - if: ${{ !contains(github.ref_name, '-') }}
        uses: actions/upload-artifact@v4
        with:
          name: pkgbuild
          path: release/PKGBUILD

  arch:
    name: Package for Arch Linux
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    container: archlinux:latest
    permissions:
      contents: write
    steps:
      - name: Set up Arch
        run: |
          pacman -Syu --noconfirm --needed base-devel github-cli
          useradd -m builder
      - uses: actions/download-artifact@v4
        with:
          name: pkgbuild
          path: /tmp/aur
      # Builds from the published .deb, which also checks its checksum.
      - name: Build
        working-directory: /tmp/aur
        run: |
          chown -R builder /tmp/aur
          sudo -u builder makepkg --nodeps --noconfirm
          sudo -u builder makepkg --printsrcinfo > .SRCINFO
          cp .SRCINFO SRCINFO
      - name: Attach PKGBUILD and .SRCINFO
        working-directory: /tmp/aur
        run: gh release upload "$GITHUB_REF_NAME" PKGBUILD SRCINFO --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
