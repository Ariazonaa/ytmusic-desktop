name: Release

# A tag like v1.2.3 builds the installer, signs it for the app's updater and
# publishes a release with it. Running apps learn of the new version from the
# release's latest.json.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  existing:
    name: Look for an existing release
    # A release can also be made by hand, see docs/development.md. Its tag
    # starts this workflow too, and then there is nothing left to do.
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.look.outputs.found }}
    steps:
      - id: look
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "::notice::A release for $TAG exists already. Nothing to do."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}

  release:
    name: Build and publish
    needs: existing
    if: needs.existing.outputs.found != 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set up Rust
        run: |
          $bin = "$env:USERPROFILE/.cargo/bin"
          if (-not (Test-Path "$bin/rustup.exe")) {
            Invoke-WebRequest https://win.rustup.rs/x86_64 -OutFile "$env:TEMP/rustup-init.exe"
            & "$env:TEMP/rustup-init.exe" -y --default-toolchain none --no-modify-path
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$bin/rustup.exe" toolchain install stable --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm ci
      - run: npm test
      # The key the updater's signatures are made with. The app only installs
      # what is signed with it, see "pubkey" in src-tauri/tauri.conf.json.
      - run: npm run tauri build -- --config src-tauri/tauri.release.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - run: node scripts/release.mjs "${{ github.ref_name }}"
      - name: Publish
        run: |
          $installer = (Get-ChildItem release -Filter *.exe).FullName
          gh release create "${{ github.ref_name }}" $installer release/latest.json --title "${{ github.ref_name }}" --notes-file release/notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          GH_TOKEN: ${{ github.token }}
