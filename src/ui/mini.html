<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mini player</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #141414;
        color: #fff;
        color-scheme: dark;
        font-family: system-ui, "Segoe UI", Roboto, sans-serif;
        user-select: none;
      }
      main {
        box-sizing: border-box;
        height: 100%;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        cursor: grab;
      }
      #cover {
        flex: none;
        height: 100%;
        aspect-ratio: 1;
        border-radius: 8px;
        object-fit: cover;
        background: #2a2a2a;
      }
      #cover[hidden] {
        display: block;
        visibility: hidden;
      }
      .info {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      #title,
      #artist {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #title {
        font-size: 15px;
        font-weight: 600;
      }
      #artist {
        font-size: 13px;
        color: #aaa;
      }
      .bar {
        height: 3px;
        border-radius: 2px;
        background: #ffffff30;
        overflow: hidden;
      }
      #progress {
        height: 100%;
        width: 0;
        background: #f03;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }
      #time {
        font-size: 11px;
        color: #aaa;
        font-variant-numeric: tabular-nums;
      }
      .controls {
        display: flex;
        gap: 2px;
      }
      button {
        width: 30px;
        height: 30px;
        border: 0;
        border-radius: 15px;
        background: transparent;
        color: #fff;
        cursor: pointer;
        display: grid;
        place-items: center;
        padding: 0;
      }
      button:hover {
        background: #ffffff1f;
      }
      button:focus-visible {
        outline: 2px solid #fff;
      }
      svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
      }
      .corner {
        position: fixed;
        top: 4px;
        right: 4px;
        display: flex;
        gap: 2px;
        opacity: 0;
        transition: opacity 0.15s;
      }
      body:hover .corner {
        opacity: 1;
      }
      .corner button {
        width: 22px;
        height: 22px;
        background: #000a;
      }
      .corner svg {
        width: 12px;
        height: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <img id="cover" alt="" hidden />
      <div class="info">
        <div id="title"></div>
        <div id="artist"></div>
        <div class="bar"><div id="progress"></div></div>
        <div class="row">
          <span id="time"></span>
          <div class="controls">
            <button type="button" id="previous">
              <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zm3.5 7L19 5v14z" /></svg>
            </button>
            <button type="button" id="play">
              <svg viewBox="0 0 24 24"><path id="play-icon" d="M8 5v14l11-7z" /></svg>
            </button>
            <button type="button" id="next">
              <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM5 5l9.5 7L5 19z" /></svg>
            </button>
          </div>
        </div>
      </div>
    </main>
    <div class="corner">
      <button type="button" id="main">
        <svg viewBox="0 0 24 24"><path d="M5 5h14v14H5zm2 2v10h10V7z" /></svg>
      </button>
      <button type="button" id="close">
        <svg viewBox="0 0 24 24"><path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6l5.6-5.6L5 6.4z" /></svg>
      </button>
    </div>
    <script type="module" src="/mini.ts"></script>
  </body>
</html>
