<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lyrics</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        color-scheme: dark;
        font-family: system-ui, "Segoe UI", Roboto, sans-serif;
        user-select: none;
        cursor: grab;
      }
      main {
        box-sizing: border-box;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        padding: 8px 40px;
        border-radius: 14px;
        text-align: center;
        color: #fff;
        text-shadow:
          0 1px 3px #000,
          0 0 12px #000c;
        transition: background 0.2s;
      }
      main:hover {
        background: #000a;
      }
      #line {
        font-size: 26px;
        font-weight: 600;
        line-height: 1.25;
      }
      #next {
        font-size: 17px;
        opacity: 0.7;
      }
      button {
        position: fixed;
        top: 6px;
        right: 8px;
        width: 26px;
        height: 26px;
        border: 0;
        border-radius: 13px;
        background: #ffffff26;
        color: #fff;
        font-size: 15px;
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.2s;
      }
      body:hover button {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <main>
      <div id="line">♪</div>
      <div id="next"></div>
    </main>
    <button type="button" id="close" aria-label="Close">✕</button>
    <script type="module" src="/overlay.ts"></script>
  </body>
</html>
